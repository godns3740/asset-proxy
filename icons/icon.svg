<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f8dff"/><stop offset="1" stop-color="#1268f0"/></linearGradient>
    <radialGradient id="bag" cx=".36" cy=".3" r=".85"><stop offset="0" stop-color="#fff2a8"/><stop offset=".35" stop-color="#ffd84a"/><stop offset=".8" stop-color="#f7b500"/><stop offset="1" stop-color="#e59a00"/></radialGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6c4"/><stop offset="1" stop-color="#ffd84a"/></linearGradient>
    <linearGradient id="tie" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a5c"/><stop offset=".6" stop-color="#f4622a"/><stop offset="1" stop-color="#d9481a"/></linearGradient>
    <radialGradient id="coin" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#dfe5ee"/><stop offset="1" stop-color="#aeb8c8"/></radialGradient>
    <linearGradient id="coinEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3ccd9"/><stop offset="1" stop-color="#8994a8"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="tiny"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="520" cy="858" rx="250" ry="34" fill="#0a3f9e" opacity=".45" filter="url(#soft)"/>

  <!-- coins popping out (behind the lip) -->
  <g transform="rotate(-14 470 300)">
    <ellipse cx="470" cy="312" rx="92" ry="94" fill="url(#coinEdge)"/>
    <ellipse cx="462" cy="300" rx="92" ry="94" fill="url(#coin)"/>
    <path d="M422 262 L440 342 L462 290 L484 342 L502 262" fill="none" stroke="#7a8597" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M424 300 H500" stroke="#7a8597" stroke-width="9" stroke-linecap="round"/>
  </g>
  <g transform="rotate(22 606 236)">
    <ellipse cx="612" cy="248" rx="86" ry="88" fill="url(#coinEdge)"/>
    <ellipse cx="606" cy="236" rx="86" ry="88" fill="url(#coin)"/>
    <path d="M568 200 L585 274 L606 226 L627 274 L644 200" fill="none" stroke="#7a8597" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M572 236 H640" stroke="#7a8597" stroke-width="8" stroke-linecap="round"/>
  </g>
  <ellipse cx="548" cy="356" rx="70" ry="34" fill="url(#coinEdge)" transform="rotate(-8 548 356)"/>
  <ellipse cx="546" cy="348" rx="70" ry="34" fill="url(#coin)" transform="rotate(-8 546 348)"/>

  <!-- ruffled lip of the bag -->
  <path d="M352 362 C 360 330, 392 318, 416 340 C 432 312, 470 310, 488 338 C 506 312, 548 312, 562 340 C 584 314, 624 318, 636 344 C 660 326, 690 340, 690 372 C 690 404, 352 404, 352 362 Z" fill="url(#lip)"/>
  <path d="M378 372 C 470 392, 590 392, 668 372" fill="none" stroke="#e8b400" stroke-width="10" stroke-linecap="round" opacity=".55"/>

  <!-- bag body -->
  <path d="M430 410 C 300 450, 222 586, 248 688 C 276 792, 410 830, 524 830 C 650 830, 776 790, 800 680 C 826 570, 740 448, 610 410 Z" fill="url(#bag)"/>
  <ellipse cx="380" cy="560" rx="62" ry="128" fill="#fff8d0" opacity=".55" transform="rotate(22 380 560)" filter="url(#tiny)"/>

  <!-- tie -->
  <path d="M398 392 C 470 428, 580 428, 650 392 C 664 386, 676 400, 668 414 C 600 462, 452 462, 380 416 C 370 404, 384 386, 398 392 Z" fill="url(#tie)"/>
  <path d="M410 404 C 480 432, 572 432, 640 404" fill="none" stroke="#ffc49e" stroke-width="7" stroke-linecap="round" opacity=".8"/>

  <!-- ₩ on the bag -->
  <g transform="rotate(-6 530 640)">
    <path d="M432 566 L472 714 L530 600 L588 714 L628 566" fill="none" stroke="#f47a1f" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M414 628 H646 M414 670 H646" stroke="#f47a1f" stroke-width="30" stroke-linecap="round"/>
  </g>
</svg>
