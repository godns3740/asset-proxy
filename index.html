<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="theme-color" content="#0e0f11">
<title>규원의 가계부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#0e0f11; --surface:#16181c; --surface2:#1e2128; --surface3:#262a32;
  --border:#2a2d35; --text:#f0f1f3; --sub:#9a9fab; --muted:#5f6470;
  --accent:#4ade80; --accent-dim:rgba(74,222,128,.13);
  --red:#f87171; --red-dim:rgba(248,113,113,.13); --blue:#38bdf8; --yellow:#fbbf24;
  --radius:16px; --tab-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;line-height:1.45}
body{min-height:100vh;padding-bottom:calc(var(--tab-h) + var(--safe-b) + 88px);overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--text)}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 12px) 16px 0}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--accent)} .dn{color:var(--red)} .sub{color:var(--sub)} .muted{color:var(--muted)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.cycle-nav{display:flex;align-items:center;gap:4px}
.cycle-nav button{width:34px;height:34px;border-radius:10px;background:var(--surface2);font-size:16px;color:var(--sub)}
.cycle-nav button:disabled{opacity:.3}
.cycle-label{font-size:13px;color:var(--sub);text-align:right;margin:-8px 0 14px}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.card h2{font-size:14px;font-weight:600;color:var(--sub);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.hero .label{font-size:13px;color:var(--sub)}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.03em;margin:2px 0 6px}
.hero .daily{display:inline-block;font-size:13px;padding:5px 10px;border-radius:999px;background:var(--accent-dim);color:var(--accent);font-weight:600}
.hero .daily.over{background:var(--red-dim);color:var(--red)}
.bar{height:8px;border-radius:99px;background:var(--surface3);overflow:hidden;margin:16px 0 8px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar.over > i{background:var(--red)}
.bar-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px}
.stat .k{font-size:12px;color:var(--sub)} .stat .v{font-size:15px;font-weight:650;margin-top:2px}

/* category bars */
.catbar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0}
.catbar .nm{display:flex;align-items:center;gap:8px;font-size:14px}
.catbar .amt{font-size:14px;font-weight:600;text-align:right}
.catbar .track{grid-column:1/-1;height:6px;border-radius:99px;background:var(--surface3);overflow:hidden}
.catbar .track i{display:block;height:100%;border-radius:99px}
.catbar .delta{font-size:11px;margin-left:4px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}

/* insights */
.tip{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.tip:first-of-type{border-top:0;padding-top:0}
.tip .ic{font-size:18px;line-height:1.3}
.tip b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.tip span{font-size:13px;color:var(--sub)}

/* transactions */
.tx-day{margin-top:6px}
.tx-day-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:10px 2px 6px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:6px;width:100%;text-align:left}
.tx .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
.tx .body{flex:1;min-width:0}
.tx .t1{font-size:14px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-size:15px;font-weight:650;flex-shrink:0}
.badge{font-size:10px;padding:2px 6px;border-radius:6px;background:var(--surface3);color:var(--sub);margin-left:4px;vertical-align:1px}

.toolbar{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;outline:none}
.search:focus{border-color:var(--accent)}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:3px}
.seg button{padding:7px 11px;border-radius:9px;font-size:13px;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--surface3);color:var(--text);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--border);font-size:13px;color:var(--sub);background:var(--surface)}
.chip.on{color:var(--text);border-color:var(--text)}
.filter-sum{font-size:13px;color:var(--sub);margin:4px 2px 2px}

/* calendar */
.cal-m{font-size:13px;color:var(--sub);margin:12px 2px 8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.cal .d{min-height:50px;border-radius:9px;background:var(--surface);border:1px solid var(--border);padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px}
.cal .d.out{opacity:.15}
.cal .d.has{background:var(--surface2);border-color:#3a3e48}
.cal .d.sel{border-color:var(--accent)}
.cal .d .n{color:var(--sub)}
.cal .d .e{color:var(--red);font-size:10px;font-weight:600}
.cal .d .i{color:var(--accent);font-size:10px;font-weight:600}
.cal .d.today .n{color:var(--accent);font-weight:700}

/* list rows (fixed / settings) */
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--border);width:100%;text-align:left}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t1{font-size:14px}
.row .t2{font-size:12px;color:var(--sub)}
.row.off .t1,.row.off .amt{color:var(--muted);text-decoration:line-through}
.link-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--border);color:var(--text);text-decoration:none;font-size:15px}
.link-row:first-of-type{border-top:0}
.link-row span{color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 16px;border-radius:13px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:#06210f}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{background:var(--red-dim);color:var(--red)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(var(--tab-h) + var(--safe-b) + 16px);width:56px;height:56px;border-radius:18px;background:var(--accent);color:#06210f;font-size:28px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:40}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(18,20,23,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;justify-content:center;z-index:50}
.tabs nav{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--text)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;border-top:1px solid var(--border);padding:10px 18px calc(18px + var(--safe-b));z-index:90;transform:translateY(105%);visibility:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s linear .25s;max-height:92vh;overflow-y:auto}
.sheet.open{transform:none;visibility:visible;transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s}
.grab{width:40px;height:5px;border-radius:9px;background:var(--surface3);margin:0 auto 12px}
.sheet h3{font-size:18px;font-weight:700;margin-bottom:14px}
.field{margin-bottom:14px}
.field > label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px;outline:none;font-size:16px}
.input:focus{border-color:var(--accent)}
.amount-input{font-size:28px;font-weight:700;padding:10px 12px}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.type-toggle button{padding:11px;border-radius:12px;background:var(--surface2);color:var(--sub);font-weight:600}
.type-toggle button.on.exp{background:var(--red-dim);color:var(--red)}
.type-toggle button.on.inc{background:var(--accent-dim);color:var(--accent)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{padding:7px 11px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-size:13px;color:var(--sub);display:inline-flex;align-items:center;gap:6px}
.pick button.on{border-color:var(--text);color:var(--text)}
.check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--sub)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.sheet-actions{display:flex;gap:8px;margin-top:6px}
.sheet-actions .btn{flex:1}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colors button{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.colors button.on{border-color:var(--text)}

.empty{text-align:center;color:var(--muted);padding:36px 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 84px);transform:translate(-50%,20px);background:#2b2f37;color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:all .2s;z-index:100;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{display:flex;justify-content:center;padding:60px 0;color:var(--muted)}
.lock{max-width:360px;margin:18vh auto 0;padding:0 24px;text-align:center}
.lock h1{font-size:22px;margin-bottom:6px}
.lock p{color:var(--sub);font-size:14px;margin-bottom:20px}
.lock .input{text-align:center;margin-bottom:10px}
.lock .btn{width:100%}
</style>
</head>
<body>

<div id="lock" class="lock hidden">
  <h1>🔒 가계부</h1>
  <p>비밀번호를 입력해 주세요</p>
  <form id="lock-form">
    <input id="lock-input" class="input" type="password" autocomplete="current-password" inputmode="text" placeholder="비밀번호">
    <button class="btn primary" type="submit">열기</button>
  </form>
  <p id="lock-err" class="dn hidden" style="margin-top:12px">비밀번호가 맞지 않아요</p>
</div>

<div id="app" class="hidden">
  <div class="wrap">

    <!-- HOME -->
    <section id="v-home" data-view>
      <div class="top">
        <h1 id="home-title">이번 달</h1>
        <div class="cycle-nav">
          <button data-cycle="-1" aria-label="이전 달">‹</button>
          <button data-cycle="1" aria-label="다음 달">›</button>
        </div>
      </div>
      <div class="cycle-label num" id="home-period"></div>

      <div class="card hero">
        <div class="label">쓸 수 있는 돈</div>
        <div class="big num" id="h-remain">—</div>
        <span class="daily" id="h-daily"></span>
        <div class="bar" id="h-bar"><i style="width:0"></i></div>
        <div class="bar-legend num"><span id="h-spent"></span><span id="h-usable"></span></div>
      </div>

      <div class="stats">
        <div class="stat"><div class="k">수입</div><div class="v num up" id="h-income">—</div></div>
        <div class="stat"><div class="k">고정지출</div><div class="v num" id="h-fixed">—</div></div>
        <div class="stat"><div class="k">변동지출</div><div class="v num" id="h-var">—</div></div>
      </div>

      <div class="card">
        <h2>어디에 썼나 <span class="muted" style="font-size:12px;font-weight:400">지난달 대비</span></h2>
        <div id="h-cats"></div>
      </div>

      <div class="card">
        <h2>💡 절약 포인트</h2>
        <div id="h-tips"></div>
      </div>

      <div class="card">
        <h2>최근 내역 <button class="sub" data-go="tx" style="font-size:13px">전체 ›</button></h2>
        <div id="h-recent"></div>
      </div>
    </section>

    <!-- TRANSACTIONS -->
    <section id="v-tx" data-view class="hidden">
      <div class="top">
        <h1 id="tx-title">내역</h1>
        <div class="cycle-nav">
          <button data-cycle="-1" aria-label="이전 달">‹</button>
          <button data-cycle="1" aria-label="다음 달">›</button>
        </div>
      </div>
      <div class="cycle-label num" id="tx-period"></div>
      <div class="toolbar">
        <input class="search" id="tx-search" type="search" placeholder="가게, 메모, 카테고리 검색">
        <div class="seg" id="tx-view">
          <button data-v="list" class="on">목록</button>
          <button data-v="cal">달력</button>
        </div>
      </div>
      <div class="chips" id="tx-type">
        <button class="chip on" data-t="">전체</button>
        <button class="chip" data-t="지출">지출</button>
        <button class="chip" data-t="수입">수입</button>
      </div>
      <div class="chips" id="tx-cats"></div>
      <div class="filter-sum num hidden" id="tx-sum"></div>
      <div id="tx-cal" class="hidden"></div>
      <div id="tx-list"></div>
    </section>

    <!-- FIXED -->
    <section id="v-fixed" data-view class="hidden">
      <div class="top"><h1>고정지출</h1><button class="btn small ghost" id="fx-add">+ 추가</button></div>
      <div class="card hero">
        <div class="label">매달 나가는 돈</div>
        <div class="big num" id="fx-total">—</div>
        <div class="sub" style="font-size:13px">끈 항목은 합계에서 빠져요. 문자로 들어온 같은 이름의 출금은 변동지출에서 자동으로 빠져요.</div>
      </div>
      <div id="fx-list"></div>
    </section>

    <!-- MORE -->
    <section id="v-more" data-view class="hidden">
      <div class="top"><h1>더보기</h1></div>
      <div class="card">
        <h2>카테고리 <button class="btn small ghost" id="cat-add">+ 추가</button></h2>
        <div class="seg" id="cat-type" style="margin-bottom:10px;width:max-content">
          <button data-t="지출" class="on">지출</button>
          <button data-t="수입">수입</button>
        </div>
        <div id="cat-list"></div>
      </div>
      <div class="card">
        <h2>자산 · 계획 <span class="muted" style="font-size:12px;font-weight:400">예전 화면</span></h2>
        <a class="link-row" href="/old/">자산 관리 · 시뮬레이터 · 타임라인 <span>›</span></a>
        <a class="link-row" href="/old/">내집마련 계산기 <span>›</span></a>
      </div>
      <div class="card">
        <h2>기기</h2>
        <button class="link-row" id="logout" style="width:100%">이 기기에서 잠그기 <span>›</span></button>
      </div>
    </section>

  </div>

  <button class="fab" id="fab" aria-label="내역 추가">+</button>

  <div class="tabs"><nav>
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
    <button data-tab="tx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>내역</button>
    <button data-tab="fixed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>고정지출</button>
    <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>더보기</button>
  </nav></div>
</div>

<!-- sheets -->
<div class="scrim" id="scrim"></div>

<div class="sheet" id="sh-tx" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3 id="sh-tx-title">내역 추가</h3>
  <div class="type-toggle" id="t-type">
    <button data-t="지출" class="exp on">지출</button>
    <button data-t="수입" class="inc">수입</button>
  </div>
  <div class="field"><input class="input amount-input num" id="t-amount" inputmode="numeric" placeholder="0원" autocomplete="off"></div>
  <div class="field"><label>어디서 / 메모</label><input class="input" id="t-memo" placeholder="예: 스타벅스" autocomplete="off"></div>
  <div class="field"><label>날짜</label><input class="input" id="t-date" type="date"></div>
  <div class="field"><label>카테고리</label><div class="pick" id="t-cats"></div></div>
  <div class="field"><label>결제수단</label><div class="pick" id="t-pay"></div></div>
  <div class="field"><label class="check"><input type="checkbox" id="t-fixed"> 고정지출 (변동지출 합계에서 빼기)</label></div>
  <div class="sheet-actions">
    <button class="btn danger hidden" id="t-del">삭제</button>
    <button class="btn ghost" data-close>취소</button>
    <button class="btn primary" id="t-save">저장</button>
  </div>
</div>

<div class="sheet" id="sh-fx" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3 id="sh-fx-title">고정지출 추가</h3>
  <div class="field"><label>이름 (문자에 찍히는 이름과 같게 하면 자동 구분돼요)</label><input class="input" id="f-name" placeholder="예: 넷플릭스" autocomplete="off"></div>
  <div class="field"><label>금액</label><input class="input num" id="f-amount" inputmode="numeric" placeholder="0원" autocomplete="off"></div>
  <div class="field"><label>분류</label><input class="input" id="f-cat" placeholder="예: 구독, 통신, 보험" list="f-cat-list" autocomplete="off"><datalist id="f-cat-list"></datalist></div>
  <div class="field"><label class="check"><input type="checkbox" id="f-active" checked> 이번 달 합계에 포함</label></div>
  <div class="sheet-actions">
    <button class="btn danger hidden" id="f-del">삭제</button>
    <button class="btn ghost" data-close>취소</button>
    <button class="btn primary" id="f-save">저장</button>
  </div>
</div>

<div class="sheet" id="sh-cat" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3 id="sh-cat-title">카테고리 추가</h3>
  <div class="field"><label>이름</label><input class="input" id="c-name" autocomplete="off"></div>
  <div class="field"><label>색</label><div class="colors" id="c-colors"></div></div>
  <div class="sheet-actions">
    <button class="btn danger hidden" id="c-del">삭제</button>
    <button class="btn ghost" data-close>취소</button>
    <button class="btn primary" id="c-save">저장</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
// ─── 기본 설정 ───────────────────────────────────────────────
const API = '';                      // 같은 주소의 /api 사용
const TOKEN_KEY = 'gw_app_token';    // 예전 앱과 같은 저장 키
const SALARY_CATS = ['월급', '급여'];
const PAYMENTS = ['체크카드', '계좌이체', '토스', '카카오페이', '신용카드', '현금'];
const PALETTE = ['#4ade80','#22d3ee','#38bdf8','#818cf8','#a78bfa','#c084fc','#f472b6','#fb7185','#f87171','#fb923c','#f59e0b','#fbbf24','#a3e635','#94a3b8','#6b7280'];

// ─── 유틸 ────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const W = n => Math.round(n).toLocaleString('ko-KR') + '원';
const signed = (n, t) => (t === '수입' ? '+' : '-') + W(n);
const short = n => { const a = Math.abs(n); return a >= 10000 ? (Math.round(a / 1000) / 10).toLocaleString('ko-KR') + '만' : a.toLocaleString('ko-KR') + (a ? '원' : ''); };
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const ymKey = (y, m) => `${y}-${pad(m)}`;            // m: 1~12
const ymShift = (key, n) => { let [y, m] = key.split('-').map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return ymKey(y, m); };
const fmtMD = s => { const d = parseD(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const DOW = ['일','월','화','수','목','금','토'];
const digits = s => parseInt(String(s).replace(/[^\d]/g, ''), 10) || 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }

// ─── API ─────────────────────────────────────────────────────
function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
function setToken(v) { try { v ? localStorage.setItem(TOKEN_KEY, v) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
async function api(path, opts = {}) {
  const headers = { 'x-app-token': getToken() };
  if (opts.body !== undefined) headers['Content-Type'] = 'application/json';
  const r = await fetch(API + '/api/' + path, { method: opts.method || 'GET', headers, body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401) { setToken(''); showLock(true); throw new Error('unauthorized'); }
  const data = await r.json().catch(() => null);
  if (!r.ok) throw new Error((data && (data.message || data.error)) || ('HTTP ' + r.status));
  return data;
}

// ─── 상태 ────────────────────────────────────────────────────
const S = {
  tx: [], fixed: [], cats: [],
  cycle: null,          // 'YYYY-MM' (월급을 받은 달 기준 다음 달 표기)
  tab: 'home',
  txType: '', txCats: new Set(), txView: 'list', calSel: null,
  catType: '지출',
  edit: { tx: null, fx: null, cat: null },
};

// ─── 월급 사이클 ─────────────────────────────────────────────
// "11월" = 10월 월급날부터 11월 월급 전날까지. 월급 기록이 없으면 25일 기준.
function salaryDate(key) {
  const ds = S.tx.filter(t => t.type === '수입' && SALARY_CATS.includes(t.category) && t.date.startsWith(key)).map(t => t.date).sort();
  return ds[0] || null;
}
function cycleRange(key) {
  const prev = ymShift(key, -1);
  const start = salaryDate(prev) || `${prev}-25`;
  const nextStart = salaryDate(key) || `${key}-25`;
  return { start, end: addDays(nextStart, -1) };
}
function cycleOf(dateStr) {
  let key = dateStr.slice(0, 7);
  if (dateStr >= cycleRange(ymShift(key, 1)).start) key = ymShift(key, 1);
  else if (dateStr < cycleRange(key).start) key = ymShift(key, -1);
  return key;
}
function cycleBounds() {
  const cur = cycleOf(today());
  const first = S.tx.length ? cycleOf(S.tx.map(t => t.date).sort()[0]) : cur;
  return { first, last: cur };
}
function cycleSummary(key) {
  const { start, end } = cycleRange(key);
  const txs = S.tx.filter(t => t.date >= start && t.date <= end);
  const income = txs.filter(t => t.type === '수입').reduce((s, t) => s + t.amount, 0);
  const fixed = S.fixed.filter(f => f.is_active !== false).reduce((s, f) => s + Number(f.amount), 0);
  const varTx = txs.filter(t => t.type === '지출' && !t.is_fixed);
  const variable = varTx.reduce((s, t) => s + t.amount, 0);
  const byCat = {};
  varTx.forEach(t => { byCat[t.category] = (byCat[t.category] || 0) + t.amount; });
  const salary = txs.filter(t => t.type === '수입' && SALARY_CATS.includes(t.category)).reduce((s, t) => s + t.amount, 0);
  return { start, end, txs, income, salary, fixed, variable, usable: income - fixed, remain: income - fixed - variable, byCat };
}
const catColor = name => (S.cats.find(c => c.name === name) || {}).color || '#6b7280';
const cycleTitle = key => { const [y, m] = key.split('-').map(Number); const cur = cycleOf(today()); return key === cur ? '이번 달' : (y === new Date().getFullYear() ? `${m}월` : `${y}년 ${m}월`); };

// ─── 데이터 로드 ─────────────────────────────────────────────
async function loadAll() {
  const [tx, fixed, cats] = await Promise.all([api('transactions'), api('fixed'), api('categories')]);
  S.tx = (Array.isArray(tx) ? tx : []).map(t => ({ ...t, amount: Number(t.amount) || 0 }));
  S.fixed = Array.isArray(fixed) ? fixed : [];
  S.cats = Array.isArray(cats) ? cats : [];
  if (!S.cycle) S.cycle = cycleOf(today());
}

// ─── 렌더: 홈 ────────────────────────────────────────────────
function renderHome() {
  const key = S.cycle, s = cycleSummary(key), cur = cycleOf(today());
  $('#home-title').textContent = cycleTitle(key);
  $('#home-period').textContent = `${s.start.replace(/-/g, '.')} ~ ${s.end.replace(/-/g, '.')}`;
  const daily = $('#h-daily');
  if (!s.salary) {
    // 월급이 아직 기록되지 않은 사이클: 초과로 보이지 않게 쓴 돈만 보여 줍니다
    $('.hero .label').textContent = '지금까지 쓴 돈';
    $('#h-remain').textContent = W(s.variable);
    $('#h-remain').className = 'big num';
    daily.textContent = `월급 전 · 고정지출 ${W(s.fixed)} 예정`;
    daily.className = 'daily';
    $('#h-bar').className = 'bar';
    $('#h-bar i').style.width = '0%';
    $('#h-spent').textContent = `변동지출 ${W(s.variable)}`;
    $('#h-usable').textContent = '월급이 들어오면 계산돼요';
  } else {
    $('.hero .label').textContent = '쓸 수 있는 돈';
    $('#h-remain').textContent = W(s.remain);
    $('#h-remain').className = 'big num ' + (s.remain < 0 ? 'dn' : '');
    if (key === cur) {
      const left = Math.max(1, Math.round((parseD(s.end) - parseD(today())) / 864e5) + 1);
      daily.textContent = s.remain >= 0 ? `남은 ${left}일 · 하루 ${W(Math.floor(s.remain / left))}` : `${W(-s.remain)} 초과했어요`;
    } else {
      daily.textContent = s.remain >= 0 ? `${W(s.remain)} 남기고 마감` : `${W(-s.remain)} 초과로 마감`;
    }
    daily.className = 'daily' + (s.remain < 0 ? ' over' : '');
    const pct = s.usable > 0 ? Math.min(100, s.variable / s.usable * 100) : (s.variable > 0 ? 100 : 0);
    $('#h-bar').className = 'bar' + (s.remain < 0 ? ' over' : '');
    $('#h-bar i').style.width = pct + '%';
    $('#h-spent').textContent = `변동지출 ${W(s.variable)}`;
    $('#h-usable').textContent = `사용 가능 ${W(Math.max(0, s.usable))}`;
  }
  $('#h-income').textContent = short(s.income);
  $('#h-fixed').textContent = short(s.fixed);
  $('#h-var').textContent = short(s.variable);

  // 카테고리
  const prev = cycleSummary(ymShift(key, -1));
  const entries = Object.entries(s.byCat).sort((a, b) => b[1] - a[1]);
  const max = entries.length ? entries[0][1] : 1;
  $('#h-cats').innerHTML = entries.length ? entries.map(([c, v]) => {
    const p = prev.byCat[c] || 0, d = v - p;
    const delta = p ? `<span class="delta ${d > 0 ? 'dn' : 'up'}">${d > 0 ? '▲' : '▼'}${short(d)}</span>` : '';
    return `<button class="catbar" data-catgo="${esc(c)}" style="width:100%;text-align:left">
      <span class="nm"><span class="dot" style="background:${esc(catColor(c))}"></span>${esc(c)}</span>
      <span class="amt num">${W(v)}${delta}</span>
      <span class="track"><i style="width:${(v / max * 100).toFixed(1)}%;background:${esc(catColor(c))}"></i></span>
    </button>`;
  }).join('') : '<div class="empty">아직 지출이 없어요</div>';

  $('#h-tips').innerHTML = tips(s, prev, key === cur).map(t => `<div class="tip"><div class="ic">${t[0]}</div><div><b>${esc(t[1])}</b><span>${esc(t[2])}</span></div></div>`).join('') || '<div class="empty">내역이 쌓이면 절약 포인트를 알려 드려요</div>';

  const recent = [...s.txs].sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id)).slice(0, 5);
  $('#h-recent').innerHTML = recent.length ? recent.map(txRow).join('') : '<div class="empty">내역이 없어요</div>';
}

function tips(s, prev, isCurrent) {
  const out = [];
  if (!s.salary && isCurrent) out.push(['📥', '월급이 아직 없어요', `월급이 '월급' 카테고리로 들어오면 쓸 수 있는 돈과 하루 예산이 계산돼요.`]);
  if (s.salary && s.remain < 0) out.push(['⚠️', `${W(-s.remain)} 초과`, '남은 기간엔 꼭 필요한 지출만 해 보세요.']);
  // 지난달보다 많이 늘어난 카테고리
  const rises = Object.entries(s.byCat).map(([c, v]) => [c, v, prev.byCat[c] || 0]).filter(([, v, p]) => p > 0 && v - p >= 30000 && v / p >= 1.3).sort((a, b) => (b[1] - b[2]) - (a[1] - a[2]));
  rises.slice(0, 2).forEach(([c, v, p]) => out.push(['📈', `${c} ${Math.round(v / p * 100 - 100)}% 늘었어요`, `지난달 ${W(p)} → 이번 달 ${W(v)}`]));
  // 자잘한 지출이 쌓이는 곳
  const small = {};
  s.txs.filter(t => t.type === '지출' && !t.is_fixed && t.amount <= 15000).forEach(t => { small[t.category] = small[t.category] || { n: 0, sum: 0 }; small[t.category].n++; small[t.category].sum += t.amount; });
  const topSmall = Object.entries(small).sort((a, b) => b[1].sum - a[1].sum)[0];
  if (topSmall && topSmall[1].n >= 5) out.push(['☕', `${topSmall[0]} 소액 결제 ${topSmall[1].n}번`, `1만5천원 이하 결제가 모여 ${W(topSmall[1].sum)}예요. 횟수를 반으로 줄이면 약 ${W(topSmall[1].sum / 2)} 아껴요.`]);
  // 자주 가는 가게
  const shops = {};
  s.txs.filter(t => t.type === '지출' && !t.is_fixed && t.memo).forEach(t => { const k = t.memo.split(' · ')[0]; shops[k] = shops[k] || { n: 0, sum: 0 }; shops[k].n++; shops[k].sum += t.amount; });
  const topShop = Object.entries(shops).filter(([, v]) => v.n >= 4).sort((a, b) => b[1].sum - a[1].sum)[0];
  if (topShop) out.push(['🏪', `${topShop[0]}에서 ${topShop[1].n}번`, `이번 달 ${W(topShop[1].sum)} 썼어요.`]);
  if (s.fixed > 0 && s.salary > 0 && s.fixed / s.salary > 0.5) out.push(['📌', `고정지출이 월급의 ${Math.round(s.fixed / s.salary * 100)}%`, '구독·통신·보험 중 안 쓰는 게 있는지 점검해 보세요.']);
  if (!out.length && s.remain >= 0 && s.salary > 0) out.push(['👍', '잘 지키고 있어요', `지금 페이스면 ${W(s.remain)} 남길 수 있어요.`]);
  return out.slice(0, 4);
}

function txRow(t) {
  const c = catColor(t.category);
  const [title, time] = String(t.memo || '').split(' · ');
  return `<button class="tx" data-tx="${t.id}">
    <span class="ic" style="background:${esc(c)}22;color:${esc(c)}">${esc((t.category || '?').slice(0, 1))}</span>
    <span class="body"><span class="t1" style="display:block">${esc(title || t.category)}${t.is_fixed ? '<span class="badge">고정</span>' : ''}</span>
      <span class="t2" style="display:block">${esc(t.category)}${t.payment ? ' · ' + esc(t.payment) : ''}${time ? ' · ' + esc(time) : ''}</span></span>
    <span class="amt num ${t.type === '수입' ? 'up' : ''}">${signed(t.amount, t.type)}</span>
  </button>`;
}

// ─── 렌더: 내역 ──────────────────────────────────────────────
function filteredTx(s) {
  const q = $('#tx-search').value.trim().toLowerCase();
  return s.txs.filter(t => (!S.txType || t.type === S.txType)
    && (!S.txCats.size || S.txCats.has(t.category))
    && (!q || [t.memo, t.category, t.payment].some(v => String(v || '').toLowerCase().includes(q))));
}
function renderTx() {
  const s = cycleSummary(S.cycle);
  $('#tx-title').textContent = cycleTitle(S.cycle) + ' 내역';
  $('#tx-period').textContent = `${s.start.replace(/-/g, '.')} ~ ${s.end.replace(/-/g, '.')}`;
  $$('#tx-type .chip').forEach(b => b.classList.toggle('on', b.dataset.t === S.txType));
  $$('#tx-view button').forEach(b => b.classList.toggle('on', b.dataset.v === S.txView));
  const used = [...new Set(s.txs.filter(t => !S.txType || t.type === S.txType).map(t => t.category))].sort();
  $('#tx-cats').innerHTML = used.map(c => `<button class="chip ${S.txCats.has(c) ? 'on' : ''}" data-c="${esc(c)}"><span class="dot" style="background:${esc(catColor(c))}"></span>${esc(c)}</button>`).join('');
  const list = filteredTx(s);
  const filtered = S.txType || S.txCats.size || $('#tx-search').value.trim();
  const exp = list.filter(t => t.type === '지출').reduce((a, t) => a + t.amount, 0);
  const inc = list.filter(t => t.type === '수입').reduce((a, t) => a + t.amount, 0);
  $('#tx-sum').classList.toggle('hidden', !filtered);
  $('#tx-sum').innerHTML = `${list.length}건${exp ? ` · 지출 <b class="dn">${W(exp)}</b>` : ''}${inc ? ` · 수입 <b class="up">${W(inc)}</b>` : ''}`;

  $('#tx-cal').classList.toggle('hidden', S.txView !== 'cal');
  let shown = list;
  if (S.txView === 'cal') { renderCal(s, list); if (S.calSel) shown = list.filter(t => t.date === S.calSel); else shown = []; }
  const byDate = {};
  shown.forEach(t => { (byDate[t.date] = byDate[t.date] || []).push(t); });
  const days = Object.keys(byDate).sort().reverse();
  $('#tx-list').innerHTML = days.length ? days.map(d => {
    const items = byDate[d].sort((a, b) => String(b.memo).localeCompare(String(a.memo)));
    const de = items.filter(t => t.type === '지출').reduce((a, t) => a + t.amount, 0);
    const di = items.filter(t => t.type === '수입').reduce((a, t) => a + t.amount, 0);
    const dd = parseD(d);
    return `<div class="tx-day"><div class="tx-day-h num"><span>${dd.getMonth() + 1}월 ${dd.getDate()}일 ${DOW[dd.getDay()]}</span><span>${di ? `<span class="up">+${W(di)}</span> ` : ''}${de ? `-${W(de)}` : ''}</span></div>${items.map(txRow).join('')}</div>`;
  }).join('') : (S.txView === 'cal' ? '<div class="empty">날짜를 누르면 그날 내역이 보여요</div>' : '<div class="empty">내역이 없어요</div>');
}
function renderCal(s, list) {
  const exp = {}, inc = {};
  list.forEach(t => { (t.type === '수입' ? inc : exp)[t.date] = ((t.type === '수입' ? inc : exp)[t.date] || 0) + t.amount; });
  let html = '', d = parseD(s.start);
  d.setDate(1);
  const endD = parseD(s.end), td = today();
  while (d <= endD) {
    const y = d.getFullYear(), m = d.getMonth(), dim = new Date(y, m + 1, 0).getDate();
    html += `<div class="cal-m">${y}년 ${m + 1}월</div><div class="cal">` + DOW.map(x => `<div class="h">${x}</div>`).join('');
    for (let i = 0; i < new Date(y, m, 1).getDay(); i++) html += '<div></div>';
    for (let day = 1; day <= dim; day++) {
      const ds = `${y}-${pad(m + 1)}-${pad(day)}`, inR = ds >= s.start && ds <= s.end, has = inR && (exp[ds] || inc[ds]);
      html += `<button class="d ${inR ? '' : 'out'} ${has ? 'has' : ''} ${S.calSel === ds ? 'sel' : ''} ${ds === td ? 'today' : ''}" ${inR ? `data-day="${ds}"` : 'disabled'}>
        <span class="n">${day}</span>${inR && inc[ds] ? `<span class="i">+${short(inc[ds])}</span>` : ''}${inR && exp[ds] ? `<span class="e">-${short(exp[ds])}</span>` : ''}</button>`;
    }
    html += '</div>';
    d = new Date(y, m + 1, 1);
  }
  $('#tx-cal').innerHTML = html;
}

// ─── 렌더: 고정지출 ──────────────────────────────────────────
function renderFixed() {
  const active = S.fixed.filter(f => f.is_active !== false);
  $('#fx-total').textContent = W(active.reduce((s, f) => s + Number(f.amount), 0));
  const groups = {};
  S.fixed.forEach(f => { (groups[f.category || '기타'] = groups[f.category || '기타'] || []).push(f); });
  const names = Object.keys(groups).sort();
  $('#fx-list').innerHTML = names.length ? names.map(g => {
    const sum = groups[g].filter(f => f.is_active !== false).reduce((s, f) => s + Number(f.amount), 0);
    return `<div class="card"><h2>${esc(g)} <span class="num" style="color:var(--text)">${W(sum)}</span></h2>${groups[g].map(f => `
      <button class="row ${f.is_active === false ? 'off' : ''}" data-fx="${f.id}">
        <span class="grow"><span class="t1" style="display:block">${esc(f.name)}</span></span>
        <span class="amt num">${W(Number(f.amount))}</span></button>`).join('')}</div>`;
  }).join('') : '<div class="empty">고정지출을 추가해 보세요</div>';
  $('#f-cat-list').innerHTML = [...new Set(S.fixed.map(f => f.category).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join('');
}

// ─── 렌더: 더보기 ────────────────────────────────────────────
function renderMore() {
  $$('#cat-type button').forEach(b => b.classList.toggle('on', b.dataset.t === S.catType));
  const cats = S.cats.filter(c => c.type === S.catType).sort((a, b) => a.name.localeCompare(b.name));
  const counts = {};
  S.tx.forEach(t => { counts[t.category] = (counts[t.category] || 0) + 1; });
  $('#cat-list').innerHTML = cats.length ? cats.map(c => `<button class="row" data-cat="${c.id}"><span class="dot" style="background:${esc(c.color)}"></span><span class="grow t1">${esc(c.name)}</span><span class="t2">${counts[c.name] || 0}건</span></button>`).join('') : '<div class="empty">카테고리가 없어요</div>';
}

// ─── 화면 전환 ───────────────────────────────────────────────
function render() {
  const { first, last } = cycleBounds();
  $$('[data-cycle="-1"]').forEach(b => b.disabled = S.cycle <= first);
  $$('[data-cycle="1"]').forEach(b => b.disabled = S.cycle >= last);
  if (S.tab === 'home') renderHome();
  if (S.tab === 'tx') renderTx();
  if (S.tab === 'fixed') renderFixed();
  if (S.tab === 'more') renderMore();
}
function go(tab) {
  S.tab = tab;
  $$('[data-view]').forEach(v => v.classList.toggle('hidden', v.id !== 'v-' + tab));
  $$('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#fab').classList.toggle('hidden', tab === 'more' || tab === 'fixed');
  window.scrollTo(0, 0);
  render();
}

// ─── 시트 ────────────────────────────────────────────────────
function openSheet(id) { $('#scrim').classList.add('open'); $(id).classList.add('open'); }
function closeSheets() { $('#scrim').classList.remove('open'); $$('.sheet').forEach(s => s.classList.remove('open')); if (document.activeElement) document.activeElement.blur(); }

function amountInput(el) { el.addEventListener('input', () => { const n = digits(el.value); el.value = n ? n.toLocaleString('ko-KR') : ''; }); }

let txDraft = { type: '지출', category: '', payment: '체크카드' };
function renderTxPickers() {
  $$('#t-type button').forEach(b => b.classList.toggle('on', b.dataset.t === txDraft.type));
  const cats = S.cats.filter(c => c.type === txDraft.type).sort((a, b) => a.name.localeCompare(b.name));
  $('#t-cats').innerHTML = cats.map(c => `<button data-c="${esc(c.name)}" class="${c.name === txDraft.category ? 'on' : ''}"><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name)}</button>`).join('');
  $('#t-pay').innerHTML = PAYMENTS.map(p => `<button data-p="${esc(p)}" class="${p === txDraft.payment ? 'on' : ''}">${esc(p)}</button>`).join('');
}
function openTx(id) {
  const t = id ? S.tx.find(x => x.id === id) : null;
  S.edit.tx = t ? t.id : null;
  txDraft = t ? { type: t.type, category: t.category, payment: t.payment || '' } : { type: '지출', category: '', payment: '체크카드' };
  $('#sh-tx-title').textContent = t ? '내역 수정' : '내역 추가';
  $('#t-amount').value = t ? t.amount.toLocaleString('ko-KR') : '';
  $('#t-memo').value = t ? (t.memo || '') : '';
  $('#t-date').value = t ? t.date : (S.calSel || today());
  $('#t-fixed').checked = !!(t && t.is_fixed);
  $('#t-del').classList.toggle('hidden', !t);
  renderTxPickers();
  openSheet('#sh-tx');
  if (!t) setTimeout(() => $('#t-amount').focus(), 250);
}
async function saveTx() {
  const amount = digits($('#t-amount').value);
  if (!amount) return toast('금액을 입력해 주세요');
  if (!txDraft.category) return toast('카테고리를 골라 주세요');
  const body = { date: $('#t-date').value || today(), type: txDraft.type, category: txDraft.category, payment: txDraft.payment, memo: $('#t-memo').value.trim(), amount, is_fixed: $('#t-fixed').checked };
  const btn = $('#t-save'); btn.disabled = true;
  try {
    if (S.edit.tx) { await api('transactions', { method: 'PATCH', body: { id: S.edit.tx, ...body } }); Object.assign(S.tx.find(t => t.id === S.edit.tx), body); toast('수정했어요'); }
    else { const r = await api('transactions', { method: 'POST', body }); S.tx.push({ ...(r && r[0] ? r[0] : { id: Date.now(), ...body }), amount }); toast('추가했어요'); }
    closeSheets(); render();
  } catch (e) { toast('저장 실패: ' + e.message); } finally { btn.disabled = false; }
}
async function deleteTx() {
  if (!S.edit.tx || !confirm('이 내역을 삭제할까요?')) return;
  try { await api('transactions?id=' + S.edit.tx, { method: 'DELETE' }); S.tx = S.tx.filter(t => t.id !== S.edit.tx); closeSheets(); render(); toast('삭제했어요'); }
  catch (e) { toast('삭제 실패: ' + e.message); }
}

function openFx(id) {
  const f = id ? S.fixed.find(x => x.id === id) : null;
  S.edit.fx = f ? f.id : null;
  $('#sh-fx-title').textContent = f ? '고정지출 수정' : '고정지출 추가';
  $('#f-name').value = f ? f.name : '';
  $('#f-amount').value = f ? Number(f.amount).toLocaleString('ko-KR') : '';
  $('#f-cat').value = f ? (f.category || '') : '';
  $('#f-active').checked = f ? f.is_active !== false : true;
  $('#f-del').classList.toggle('hidden', !f);
  openSheet('#sh-fx');
}
async function saveFx() {
  const name = $('#f-name').value.trim(), amount = digits($('#f-amount').value);
  if (!name || !amount) return toast('이름과 금액을 입력해 주세요');
  const body = { name, amount, category: $('#f-cat').value.trim() || '기타', is_active: $('#f-active').checked };
  try {
    if (S.edit.fx) { await api('fixed', { method: 'PATCH', body: { id: S.edit.fx, ...body } }); Object.assign(S.fixed.find(f => f.id === S.edit.fx), body); }
    else { const r = await api('fixed', { method: 'POST', body }); S.fixed.push(r && r[0] ? r[0] : { id: Date.now(), ...body }); }
    closeSheets(); render(); toast('저장했어요');
  } catch (e) { toast('저장 실패: ' + e.message); }
}
async function deleteFx() {
  if (!S.edit.fx || !confirm('이 고정지출을 삭제할까요?')) return;
  try { await api('fixed?id=' + S.edit.fx, { method: 'DELETE' }); S.fixed = S.fixed.filter(f => f.id !== S.edit.fx); closeSheets(); render(); toast('삭제했어요'); }
  catch (e) { toast('삭제 실패: ' + e.message); }
}

let catColorDraft = PALETTE[0];
function openCat(id) {
  const c = id ? S.cats.find(x => x.id === id) : null;
  S.edit.cat = c ? c.id : null;
  catColorDraft = c ? c.color : PALETTE[Math.floor(Math.random() * PALETTE.length)];
  $('#sh-cat-title').textContent = c ? '카테고리 수정' : `${S.catType} 카테고리 추가`;
  $('#c-name').value = c ? c.name : '';
  $('#c-del').classList.toggle('hidden', !c);
  $('#c-colors').innerHTML = PALETTE.map(p => `<button data-col="${p}" class="${p === catColorDraft ? 'on' : ''}" style="background:${p}" aria-label="색 ${p}"></button>`).join('');
  openSheet('#sh-cat');
}
async function saveCat() {
  const name = $('#c-name').value.trim();
  if (!name) return toast('이름을 입력해 주세요');
  try {
    if (S.edit.cat) {
      const c = S.cats.find(x => x.id === S.edit.cat), old = c.name;
      await api('categories', { method: 'PATCH', body: { id: c.id, name, color: catColorDraft } });
      if (old !== name) {  // 기존 내역의 카테고리 이름도 함께 바꿉니다
        const affected = S.tx.filter(t => t.category === old);
        await Promise.all(affected.map(t => api('transactions', { method: 'PATCH', body: { id: t.id, category: name } })));
        affected.forEach(t => { t.category = name; });
      }
      Object.assign(c, { name, color: catColorDraft });
    } else {
      if (S.cats.some(c => c.name === name && c.type === S.catType)) return toast('이미 있는 이름이에요');
      const r = await api('categories', { method: 'POST', body: { name, color: catColorDraft, type: S.catType } });
      S.cats.push(r && r[0] ? r[0] : { id: Date.now(), name, color: catColorDraft, type: S.catType });
    }
    closeSheets(); render(); toast('저장했어요');
  } catch (e) { toast('저장 실패: ' + e.message); }
}
async function deleteCat() {
  const c = S.cats.find(x => x.id === S.edit.cat);
  if (!c) return;
  const n = S.tx.filter(t => t.category === c.name).length;
  if (!confirm(n ? `'${c.name}' 내역 ${n}건은 그대로 남아요. 삭제할까요?` : `'${c.name}'을(를) 삭제할까요?`)) return;
  try { await api('categories?id=' + c.id, { method: 'DELETE' }); S.cats = S.cats.filter(x => x.id !== c.id); closeSheets(); render(); toast('삭제했어요'); }
  catch (e) { toast('삭제 실패: ' + e.message); }
}

// ─── 잠금 ────────────────────────────────────────────────────
function showLock(err) {
  $('#app').classList.add('hidden');
  $('#lock').classList.remove('hidden');
  $('#lock-err').classList.toggle('hidden', !err);
  setTimeout(() => $('#lock-input').focus(), 100);
}
async function boot() {
  if (!getToken()) return showLock(false);
  $('#lock').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#v-home').insertAdjacentHTML('afterbegin', '<div class="loading" id="boot-loading">불러오는 중…</div>');
  try { await loadAll(); $('#boot-loading')?.remove(); go(S.tab); }
  catch (e) { $('#boot-loading')?.remove(); if (e.message !== 'unauthorized') toast('불러오기 실패: ' + e.message); }
}

// ─── 이벤트 ──────────────────────────────────────────────────
$('#lock-form').addEventListener('submit', e => { e.preventDefault(); const v = $('#lock-input').value.trim(); if (!v) return; setToken(v); $('#lock-input').value = ''; boot(); });
$('#logout').addEventListener('click', () => { if (confirm('이 기기에서 비밀번호를 지울까요?')) { setToken(''); showLock(false); } });
$$('.tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));
document.addEventListener('click', e => {
  const t = e.target.closest('[data-cycle],[data-go],[data-tx],[data-fx],[data-cat],[data-catgo],[data-day],[data-close]');
  if (!t) return;
  if (t.dataset.cycle && !t.disabled) { S.cycle = ymShift(S.cycle, +t.dataset.cycle); S.calSel = null; render(); }
  else if (t.dataset.go) go(t.dataset.go);
  else if (t.dataset.tx) openTx(+t.dataset.tx);
  else if (t.dataset.fx) openFx(+t.dataset.fx);
  else if (t.dataset.cat) openCat(+t.dataset.cat);
  else if (t.dataset.catgo) { S.txCats = new Set([t.dataset.catgo]); S.txType = ''; go('tx'); }
  else if (t.dataset.day) { S.calSel = S.calSel === t.dataset.day ? null : t.dataset.day; renderTx(); }
  else if (t.hasAttribute('data-close')) closeSheets();
});
$('#scrim').addEventListener('click', closeSheets);
$('#fab').addEventListener('click', () => openTx(null));
$('#tx-search').addEventListener('input', renderTx);
$('#tx-type').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; S.txType = b.dataset.t; S.txCats.clear(); renderTx(); });
$('#tx-cats').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; const c = b.dataset.c; S.txCats.has(c) ? S.txCats.delete(c) : S.txCats.add(c); renderTx(); });
$('#tx-view').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; S.txView = b.dataset.v; S.calSel = null; renderTx(); });
$('#t-type').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; if (txDraft.type !== b.dataset.t) { txDraft.type = b.dataset.t; txDraft.category = ''; } renderTxPickers(); });
$('#t-cats').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; txDraft.category = b.dataset.c; renderTxPickers(); });
$('#t-pay').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (!b) return; txDraft.payment = b.dataset.p; renderTxPickers(); });
$('#t-save').addEventListener('click', saveTx);
$('#t-del').addEventListener('click', deleteTx);
$('#fx-add').addEventListener('click', () => openFx(null));
$('#f-save').addEventListener('click', saveFx);
$('#f-del').addEventListener('click', deleteFx);
$('#cat-add').addEventListener('click', () => openCat(null));
$('#cat-type').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; S.catType = b.dataset.t; renderMore(); });
$('#c-colors').addEventListener('click', e => { const b = e.target.closest('[data-col]'); if (!b) return; catColorDraft = b.dataset.col; $$('#c-colors button').forEach(x => x.classList.toggle('on', x === b)); });
$('#c-save').addEventListener('click', saveCat);
$('#c-del').addEventListener('click', deleteCat);
amountInput($('#t-amount')); amountInput($('#f-amount'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheets(); });
// 앱으로 돌아오면 새 내역(문자 자동 기록)을 다시 불러옵니다
document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && getToken() && !$('#app').classList.contains('hidden')) { try { await loadAll(); render(); } catch (e) {} } });

boot();
</script>
</body>
</html>
